<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太一像素办公室 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
}
header {
  background: rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header h1 { color: #e0d7ff; font-size: 18px; font-weight: 500; }
header .subtitle { color: #888; font-size: 13px; margin-top: 2px; }
.status-bar {
  display: flex;
  gap: 20px;
  align-items: center;
  font-size: 13px;
  color: #aaa;
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.back-link { color: #a78bfa; font-size: 13px; text-decoration: none; }

.scene-container {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 20px;
  min-height: calc(100vh - 60px);
}

.office-wrapper {
  position: relative;
  width: 900px;
}

.floor-label {
  text-align: center;
  color: #6b7280;
  font-size: 12px;
  margin-bottom: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* 等距投影容器 */
.iso-scene {
  position: relative;
  width: 900px;
  height: 600px;
  transform-style: preserve-3d;
}

/* SVG 场景 */
.scene-svg {
  width: 100%;
  height: 100%;
}

/* 悬浮信息卡 */
.bot-tooltip {
  position: absolute;
  background: rgba(15, 15, 35, 0.95);
  border: 1px solid rgba(167, 139, 250, 0.4);
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 12px;
  color: #e0d7ff;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 100;
  min-width: 160px;
  backdrop-filter: blur(8px);
}
.bot-tooltip.visible { opacity: 1; }
.bot-tooltip .bot-name { font-size: 14px; font-weight: 500; color: #c4b5fd; margin-bottom: 6px; }
.bot-tooltip .bot-task { color: #9ca3af; font-size: 11px; margin-bottom: 8px; }
.bot-tooltip .bot-stats { display: flex; flex-direction: column; gap: 4px; }
.bot-tooltip .stat-row { display: flex; justify-content: space-between; gap: 16px; }
.bot-tooltip .stat-label { color: #6b7280; }
.bot-tooltip .stat-value { color: #4ade80; font-weight: 500; }

/* 底部状态栏 */
.bottom-stats {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
  margin-top: 20px;
}
.bot-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 10px 8px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.bot-card:hover {
  background: rgba(167,139,250,0.1);
  border-color: rgba(167,139,250,0.3);
  transform: translateY(-2px);
}
.bot-card.active {
  background: rgba(167,139,250,0.15);
  border-color: rgba(167,139,250,0.5);
}
.bot-card .card-emoji { font-size: 20px; margin-bottom: 4px; }
.bot-card .card-name { font-size: 11px; color: #c4b5fd; font-weight: 500; }
.bot-card .card-status { font-size: 10px; color: #6b7280; margin-top: 2px; }
.bot-card .card-status.working { color: #4ade80; }
.bot-card .card-status.idle { color: #f59e0b; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🏢 太一像素办公室</h1>
    <div class="subtitle">8 Bot 拟人化工作场景 · 实时动画</div>
  </div>
  <div class="status-bar">
    <div><span class="status-dot"></span>系统正常</div>
    <div>任务队列: 12</div>
    <div>今日产出: 45 文件</div>
    <a href="/" class="back-link">← 返回 Dashboard</a>

const botData = {

  '山木': { task: '代码开发 & 测试', stats: { '今日提交': '8次', '测试通过': '142/144', '代码行': '+320' }},
  '素问': { task: '健康数据分析', stats: { '分析查询': '15次', '报告生成': '3份', '异常检测': '0' }},
  '罔两': { task: '影子监控巡逻', stats: { '监控频道': '12个', '安全告警': '0', '扫描次数': '834' }},
  '庖丁': { task: '系统构建部署', stats: { '构建任务': '3个', '部署成功': '100%', '平均耗时': '2.3min' }},
  '羿': { task: '精准目标执行', stats: { '目标完成': '12/12', '精确率': '99.8%', '响应时间': '120ms' }},
  '守藏吏': { task: '知识文档归档', stats: { '归档文件': '20个', '索引条目': '1,240', '检索命中': '98%' }},
  '太一': { task: '统筹全局协调', stats: { '管理Skills': '400+', '协调任务': '89', '系统健康': '99.2%' }}
};

const tooltip = document.getElementById('tooltip');
const workstations = document.querySelectorAll('.workstation');

workstations.forEach(ws => {
  ws.addEventListener('mouseenter', (e) => {
    const name = ws.getAttribute('data-bot');
    const data = botData[name];
    if (!data) return;
    let statsHtml = '';
    for (const [k, v] of Object.entries(data.stats)) {
      statsHtml += `<div class="stat-row"><span class="stat-label">${k}</span><span class="stat-value">${v}</span></div>`;
    }
    tooltip.innerHTML = `<div class="bot-name">${name}</div><div class="bot-task">${data.task}</div><div class="bot-stats">${statsHtml}</div>`;
    tooltip.classList.add('visible');
  });
  ws.addEventListener('mousemove', (e) => {
    const rect = document.querySelector('.office-wrapper').getBoundingClientRect();
    let x = e.clientX - rect.left + 15;
    let y = e.clientY - rect.top - 10;
    if (x + 180 > rect.width) x = e.clientX - rect.left - 180;
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  });
  ws.addEventListener('mouseleave', () => {
    tooltip.classList.remove('visible');
  });
});

// 底部卡片联动
const cards = document.querySelectorAll('.bot-card');
cards.forEach((card, i) => {
  card.addEventListener('click', () => {
    cards.forEach(c => c.classList.remove('active'));
    card.classList.add('active');
  });
});

// 实时时间更新
setInterval(() => {
  const header = document.querySelector('.status-bar div:nth-child(2)');
  const tasks = Math.floor(Math.random() * 5) + 10;
  header.textContent = `任务队列: ${tasks}`;
}, 5000);
</script>
