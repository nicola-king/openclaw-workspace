a6\u22641000mm H\u226440m \u571f\u3001\u7802\u783e\u77f3", "color": "#4CAF50"}, {"id": "quota:AC0011", "type": "quota", "label": "AC0011 - \u03a6\u22641000mm H\u226440m \u5ca9\u5c42", "color": "#4CAF50"}, {"id": "quota:AC0012", "type": "quota", "label": "AC0012 - \u03a6\u22641000mm H\u226440m \u571f\u77f3\u56de\u586b\u533a", "color": "#4CAF50"}, {"id": "quota:AC0013", "type": "quota", "label": "AC0013 - \u03a6\u22641500mm H\u226420m \u571f\u3001\u7802\u783e\u77f3", "color": "#4CAF50"}, {"id": "quota:AC0014", "type": "quota", "label": "AC0014 - \u03a6\u22641500mm H\u226420m \u5ca9\u5c42", "color": "#4CAF50"}, {"id": "quota:AC0015", "type": "quota", "label": "AC0015 - \u03a6\u22641500mm H\u226420m \u571f\u77f3\u56de\u586b\u533a", "color": "#4CAF50"}];
        const edges = [];

        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#graph")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(edges).id(d => d.id).distance(100))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2));

        const link = svg.append("g")
            .selectAll("line")
            .data(edges)
            .enter().append("line")
            .attr("stroke", "#666")
            .attr("stroke-width", d => d.width);

        const node = svg.append("g")
            .selectAll("circle")
            .data(nodes)
            .enter().append("circle")
            .attr("r", 5)
            .attr("fill", d => d.color)
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        const label = svg.append("g")
            .selectAll("text")
            .data(nodes)
            .enter().append("text")
            .text(d => d.label)
            .attr("font-size", 10)
            .attr("fill", "#ccc")
            .attr("dx", 10)
            .attr("dy", 5);

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);

            label
                .attr("x", d => d.x)
                .attr("y", d => d.y);
        });

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        function searchNodes(query) {
            const filtered = nodes.filter(n =>
                n.label.toLowerCase().includes(query.toLowerCase())
            );
            node.attr("opacity", d => filtered.includes(d) ? 1 : 0.1);
            label.attr("opacity", d => filtered.includes(d) ? 1 : 0.1);
        }
    </script>
