[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "taiyi-travel-agent"
version = "2.0.0"
description = "太一旅行探路者 - 模块化自进化旅行规划系统"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "太一 AGI", email = "taiyi@taiyi.ai"},
]
keywords = ["travel", "planner", "ai-agent", "self-evolving", "modular"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Travel",
]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
taiyi-travel = "scripts.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taiyi_travel = ["**/*.md", "**/*.json"]
